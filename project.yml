name: LondonArrivals
options:
  bundleIdPrefix: com.antigravity
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "7L9YT2TMVS"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES

targets:
  LondonArrivals:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LondonArrivals/App
      - path: LondonArrivals/Tests/CommuteWidgetFlowProbe.swift
        buildPhase: sources
        compilerFlags: -D LA_WIDGET_FLOW_TEST
      - path: LondonArrivals/Shared
      - path: LondonArrivalsWidget/SelectCommuteIntent.swift
    info:
      path: LondonArrivals/App/Info.plist
      properties:
        CFBundleDisplayName: "London Arrivals"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: LondonArrivals.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.antigravity.londonarrivals
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: LondonArrivals.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.londonarrivals
        PRODUCT_NAME: LondonArrivals
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_TEAM: "7L9YT2TMVS"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LA_WIDGET_FLOW_TEST"
    dependencies:
      - target: LondonArrivalsWidget

  LondonArrivalsWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LondonArrivalsWidget
      - path: LondonArrivals/Shared
      - path: LondonArrivals/Shared/Services/ArrivalCache.swift
    info:
      path: LondonArrivalsWidget/Info.plist
      properties:
        CFBundleDisplayName: "Arrivals Board"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LondonArrivalsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.antigravity.londonarrivals
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: LondonArrivalsWidget.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.londonarrivals.widget
        PRODUCT_NAME: LondonArrivalsWidget
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_TEAM: "7L9YT2TMVS"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
